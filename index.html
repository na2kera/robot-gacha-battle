<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>ロボットガチャバトル</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100dvh;
        overflow: hidden;
        background: #0e1018;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
      }
      #app {
        box-sizing: border-box;
        width: 100%;
        height: 100%;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom)
          env(safe-area-inset-left);
      }
      #app input {
        -webkit-user-select: text;
        user-select: text;
      }
      #rotate-overlay {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0e1018;
        color: #e6e8f0;
        font:
          22px system-ui,
          sans-serif;
      }
      #banner {
        position: fixed;
        top: calc(env(safe-area-inset-top) + 8px);
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
        display: flex;
        gap: 12px;
        align-items: center;
        padding: 6px 14px;
        border-radius: 8px;
        background: rgba(20, 22, 34, 0.9);
        color: #ffb020;
        font:
          16px system-ui,
          sans-serif;
      }
      #banner button {
        font: inherit;
        padding: 4px 12px;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="banner" hidden>
      <span id="banner-text"></span><button id="banner-button" type="button" hidden></button>
    </div>
    <div id="rotate-overlay" hidden></div>
    <script type="module" src="/client/main.ts"></script>
  </body>
</html>
