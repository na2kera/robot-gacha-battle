<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>ロボットガチャバトル</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700&display=swap"
    />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100dvh;
        overflow: hidden;
        background: #172333;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
      }
      /* safe area は外側で避け、Phaser の親（#app）には padding を付けない */
      #app-wrap {
        box-sizing: border-box;
        width: 100%;
        height: 100%;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom)
          env(safe-area-inset-left);
      }
      #app {
        width: 100%;
        height: 100%;
      }
      #app input {
        -webkit-user-select: text;
        user-select: text;
      }
      #rotate-overlay {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #172333;
        color: #fff3dc;
        font:
          700 22px 'Noto Sans JP',
          system-ui,
          sans-serif;
      }
      #banner {
        position: fixed;
        top: calc(env(safe-area-inset-top) + 8px);
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
        display: flex;
        gap: 12px;
        align-items: center;
        padding: 6px 14px;
        border: 2px solid #3c5068;
        border-radius: 12px;
        background: rgba(41, 59, 80, 0.96);
        color: #ffd166;
        font:
          700 16px 'Noto Sans JP',
          system-ui,
          sans-serif;
      }
      #banner button {
        font: inherit;
        padding: 4px 12px;
        border: 0;
        border-radius: 8px;
        background: #ffd166;
        color: #2a1e05;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div id="app-wrap">
      <div id="app"></div>
      <div id="ui" hidden></div>
    </div>
    <div id="banner" hidden>
      <span id="banner-text"></span><button id="banner-button" type="button" hidden></button>
    </div>
    <div id="rotate-overlay" hidden></div>
    <script type="module" src="/client/main.ts"></script>
  </body>
</html>
